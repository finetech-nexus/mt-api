server:
  port: 8097
  error:
    include-message: always

spring:
  application:
    name: mt-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mt}
    username: ${SPRING_DATASOURCE_USERNAME:mt}
    password: ${SPRING_DATASOURCE_PASSWORD:mt}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 120000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

mt:
  merchant-id: ${MT_MERCHANT_ID:NEXUS-MERCHANT}
  callback-base-url: ${MT_CALLBACK_BASE_URL:http://localhost:8097}
  external:
    enabled: ${MT_EXTERNAL_ENABLED:true}
    base-url: ${MT_EXTERNAL_BASE_URL:http://localhost:8090}
  channel:
    enabled: ${MT_CHANNEL_ENABLED:true}
    base-url: ${CHANNEL_BASE_URL:http://localhost:8080}
    tenant: ${CHANNEL_TENANT:nexusbank}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
